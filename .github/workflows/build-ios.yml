name: Build iOS Release (No Mac Required)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'unsigned_ipa'
        type: choice
        options:
          - 'unsigned_ipa'
          - 'simulator'

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 💎 Setup Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: 🍎 Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          xcodebuild -version

      - name: 📱 Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: 🔨 Build iOS Simulator (.app)
        if: ${{ inputs.build_type == 'simulator' }}
        run: |
          cd ios
          xcodebuild -workspace MansuriKhidmatGroup.xcworkspace \
                     -scheme MansuriKhidmatGroup \
                     -configuration Release \
                     -sdk iphonesimulator \
                     -derivedDataPath ../build \
                     CODE_SIGNING_ALLOWED=NO \
                     build
          cd ..
          cd build/Build/Products/Release-iphonesimulator
          zip -r -X MansuriKhidmatGroup-Simulator.app.zip MansuriKhidmatGroup.app
          mv MansuriKhidmatGroup-Simulator.app.zip ../../../

      - name: 🔨 Build iOS Unsigned (.ipa)
        if: ${{ inputs.build_type == 'unsigned_ipa' || github.event_name == 'push' }}
        run: |
          cd ios
          xcodebuild -workspace MansuriKhidmatGroup.xcworkspace \
                     -scheme MansuriKhidmatGroup \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath ../build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build
          cd ..
          mkdir -p build-ipa/Payload
          cp -r build/Build/Products/Release-iphoneos/MansuriKhidmatGroup.app build-ipa/Payload/
          cd build-ipa
          zip -r -X MansuriKhidmatGroup.ipa Payload
          mv MansuriKhidmatGroup.ipa ../
          cd ..

      - name: 📤 Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.build_type == 'simulator' && 'MansuriKhidmatGroup-Simulator-App' || 'MansuriKhidmatGroup-iOS-IPA' }}
          path: ${{ inputs.build_type == 'simulator' && 'MansuriKhidmatGroup-Simulator.app.zip' || 'MansuriKhidmatGroup.ipa' }}
          retention-days: 14

