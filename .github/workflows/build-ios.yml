name: Build iOS Release (No Mac Required)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'unsigned_ipa'
        type: choice
        options:
          - 'unsigned_ipa'
          - 'simulator'

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: 🍎 Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          xcodebuild -version

      - name: 📱 Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: 🔨 Build iOS Simulator (.app)
        if: github.event.inputs.build_type == 'simulator'
        run: |
          cd ios
          xcodebuild -workspace MansuriKhidmatGroup.xcworkspace \
                     -scheme MansuriKhidmatGroup \
                     -configuration Release \
                     -sdk iphonesimulator \
                     -derivedDataPath ../build \
                     CODE_SIGNING_ALLOWED=NO \
                     build
          cd ..
          cd build/Build/Products/Release-iphonesimulator
          zip -r -X MansuriKhidmatGroup-Simulator.app.zip MansuriKhidmatGroup.app
          mv MansuriKhidmatGroup-Simulator.app.zip ../../../

      - name: 🔨 Build iOS Unsigned (.ipa)
        if: github.event.inputs.build_type != 'simulator'
        run: |
          cd ios
          xcodebuild -workspace MansuriKhidmatGroup.xcworkspace \
                     -scheme MansuriKhidmatGroup \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath ../build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build
          cd ..
          mkdir -p build-ipa/Payload
          cp -r build/Build/Products/Release-iphoneos/MansuriKhidmatGroup.app build-ipa/Payload/
          cd build-ipa
          zip -r -X MansuriKhidmatGroup.ipa Payload
          mv MansuriKhidmatGroup.ipa ../
          cd ..

      - name: 📤 Upload Simulator App Artifact
        if: github.event.inputs.build_type == 'simulator'
        uses: actions/upload-artifact@v4
        with:
          name: MansuriKhidmatGroup-Simulator-App
          path: MansuriKhidmatGroup-Simulator.app.zip
          retention-days: 14

      - name: 📤 Upload iOS IPA Artifact
        if: github.event.inputs.build_type != 'simulator'
        uses: actions/upload-artifact@v4
        with:
          name: MansuriKhidmatGroup-iOS-IPA
          path: MansuriKhidmatGroup.ipa
          retention-days: 14
