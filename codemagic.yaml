workflows:

  # ─────────────────────────────────────────────
  # iOS — Ad Hoc / App Store signed IPA
  # ─────────────────────────────────────────────
  react-native-ios:
    name: Mansuri Khidmat Group — iOS Build
    max_build_duration: 90
    instance_type: mac_mini_m1

    environment:
      node: 22.11.0
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "org.reactjs.native.example.MansuriKhidmatGroup"
        XCODE_WORKSPACE: "ios/MansuriKhidmatGroup.xcworkspace"
        XCODE_SCHEME: "MansuriKhidmatGroup"
      # ── Code Signing ──────────────────────────────────────────────────────
      # Add these in Codemagic UI → Team → Code Signing Identities:
      #   ios_signing_certificate  → Your .p12 certificate
      #   ios_signing_certificate_password → .p12 password
      #   ios_provisioning_profile → Your .mobileprovision file
      # Then reference them here:
      ios_signing:
        distribution_type: app_store   # or: ad_hoc | development | enterprise
        bundle_identifier: $BUNDLE_ID

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Set up Ruby gems (Bundler)
        script: |
          gem install bundler --user-install
          bundle install --path vendor/bundle || true

      - name: Install npm dependencies
        script: npm ci

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update

      - name: Set app version & build number
        script: |
          # Use Codemagic build number as iOS build number
          agvtool new-version -all $(($(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo 0) + 1)) || true
          echo "Build number set"

      - name: Build iOS IPA
        script: |
          xcode-project use-profiles
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/MansuriKhidmatGroup.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive | xcpretty

          xcodebuild \
            -exportArchive \
            -archivePath build/MansuriKhidmatGroup.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath build/ipa | xcpretty

    artifacts:
      - build/ipa/*.ipa
      - build/MansuriKhidmatGroup.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # Uncomment to auto-upload to TestFlight:
      # app_store_connect:
      #   api_key: $APP_STORE_CONNECT_PRIVATE_KEY
      #   key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
      #   issuer_id: $APP_STORE_CONNECT_ISSUER_ID
      #   submit_to_testflight: true
      email:
        recipients:
          - $CM_NOTIFY_EMAIL  # Set in Codemagic UI environment vars
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────
  # iOS — No Code Signing (Simulator / CI test)
  # ─────────────────────────────────────────────
  react-native-ios-unsigned:
    name: Mansuri Khidmat Group — iOS Unsigned Build
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      node: 22.11.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update

      - name: Build iOS App (unsigned)
        script: |
          xcodebuild \
            -workspace ios/MansuriKhidmatGroup.xcworkspace \
            -scheme MansuriKhidmatGroup \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | xcpretty

          # Package into installable IPA (works for side-loading via AltStore/Sideloadly)
          cd build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r MansuriKhidmatGroup.app Payload/
          zip -r -X MansuriKhidmatGroup-unsigned.ipa Payload

    artifacts:
      - build/Build/Products/Release-iphoneos/MansuriKhidmatGroup-unsigned.ipa

  # ─────────────────────────────────────────────
  # Android — Release APK (bonus workflow)
  # ─────────────────────────────────────────────
  react-native-android:
    name: Mansuri Khidmat Group — Android APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      node: 22.11.0
      java: 17

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

    artifacts:
      - android/app/build/outputs/apk/release/app-release.apk

    publishing:
      email:
        recipients:
          - $CM_NOTIFY_EMAIL
        notify:
          success: true
          failure: true
