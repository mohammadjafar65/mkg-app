workflows:

  # ─────────────────────────────────────────────
  # iOS — Unsigned IPA (no Apple account needed)
  # Side-load with AltStore / Sideloadly / 3uTools
  # ─────────────────────────────────────────────
  react-native-ios-unsigned:
    name: Mansuri Khidmat Group — iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      node: 22.11.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update

      - name: Build iOS App (unsigned)
        script: |
          xcodebuild \
            -workspace ios/MansuriKhidmatGroup.xcworkspace \
            -scheme MansuriKhidmatGroup \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | xcpretty

          # Package into IPA (side-loadable via AltStore / Sideloadly)
          cd build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r MansuriKhidmatGroup.app Payload/
          zip -r -X MansuriKhidmatGroup.ipa Payload

    artifacts:
      - build/Build/Products/Release-iphoneos/MansuriKhidmatGroup.ipa

  # ─────────────────────────────────────────────
  # Android — Release APK
  # ─────────────────────────────────────────────
  react-native-android:
    name: Mansuri Khidmat Group — Android APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      node: 22.11.0
      java: 17

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

    artifacts:
      - android/app/build/outputs/apk/release/app-release.apk
